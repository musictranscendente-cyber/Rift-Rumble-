# Compila o APK (e o pacote do CrazyGames) a cada push no branch principal e publica como Release.
# O app instalado consulta o último Release e oferece a atualização.
name: APK

on:
  push:
    paths:
      - 'web/**'
      - 'android/**'
      - 'tools/build-apk.sh'
      - 'tools/build-web.sh'
      - 'tools/build-aab.sh'
      - '.github/workflows/apk.yml'
      - 'tools/play-publish.py'
  workflow_dispatch:

permissions:
  contents: write

# Google Play (preenchidos depois de rodar o script do Cloud Shell; não são segredos)
env:
  PLAY_WIF_PROVIDER: 'projects/319017136739/locations/global/workloadIdentityPools/github/providers/rift-rumble'
  PLAY_SERVICE_ACCOUNT: 'play-publisher@rift-rumble-play.iam.gserviceaccount.com'

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ferramentas do Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange

      - name: Compilar APK
        run: ./tools/build-apk.sh

      - name: Pacote para o CrazyGames
        run: ./tools/build-web.sh crazygames

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          TAG="v$CODE"
          NOTES=$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/RiftRumble.apk release/RiftRumble-crazygames.zip --clobber
          else
            gh release create "$TAG" release/RiftRumble.apk release/RiftRumble-crazygames.zip --title "Rift Rumble 1.0.$CODE" --notes "$NOTES" --latest
          fi

  # .aab para a Google Play (assinado com a chave de upload guardada nos Secrets do repositório)
  aab:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Chave de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "Sem a chave nos Secrets: o .aab sai sem assinatura"
          fi

      - name: Compilar AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./tools/build-aab.sh

      - name: Anexar ao Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$(git rev-list --count HEAD)" release/RiftRumble.aab --clobber

      # Teste interno da Google Play: login sem chave (Workload Identity Federation do Google Cloud)
      - name: Login no Google Cloud
        id: gcp
        if: env.PLAY_WIF_PROVIDER != '' && env.KEYSTORE_FILE != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Enviar para o teste interno da Google Play
        if: steps.gcp.outcome == 'success'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          pip install -q google-auth requests
          NOTES=$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' | head -1)
          python3 tools/play-publish.py upload release/RiftRumble.aab internal "$NOTES"
