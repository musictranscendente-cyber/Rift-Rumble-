// App da Google Play: mesmo código e ícones do APK (../src, ../res) e o jogo de build/play-assets.
// Uso: ./tools/build-aab.sh  (assina se KEYSTORE_FILE, KEYSTORE_PASSWORD estiverem no ambiente)
plugins {
    id 'com.android.application' version '8.11.1'
}

def code = (System.getenv('VERSION_CODE') ?: '1') as int
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.riftrumble.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.riftrumble.game'
        minSdk 24
        targetSdk 36
        versionCode code
        versionName "1.0.${code}"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = [file('../../build/play-assets')]
        }
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
